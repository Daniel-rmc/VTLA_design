dataset:
  repo_id: local/manipulationnet_peg_in_hole_15holes
  root: /workspace/datasets/manipulationNet/peg_in_hole/15holes_v3
  video_backend: pyav
  return_uint8: true
  use_imagenet_stats: true
  eval_split: 0.1
policy:
  type: vtla
  device: cuda
  dtype: bfloat16
  use_amp: true
  push_to_hub: false
  chunk_size: 50
  n_action_steps: 1
  image_size: [224, 224]
  tactile_feature_names:
    - observation.images.left_tactile_left_camera
    - observation.images.left_tactile_right_camera
    - observation.images.right_tactile_left_camera
    - observation.images.right_tactile_right_camera
  vision_backbone: resnet18
  tactile_backbone: resnet18
  vision_backbone_weights: ResNet18_Weights.IMAGENET1K_V1
  tactile_backbone_weights: ResNet18_Weights.IMAGENET1K_V1
  dim_model: 512
  n_heads: 8
  dim_feedforward: 3200
  n_encoder_layers: 4
  n_decoder_layers: 7
  cross_attention_layers: 2
  use_vae: true
  latent_dim: 32
  n_vae_encoder_layers: 4
  kl_weight: 10.0
  use_tactile_refine: true
  tactile_refine_scale: 0.1
  temporal_ensemble_coeff: 0.01
  optimizer_lr: 0.00001
  optimizer_lr_backbone: 0.00001
  optimizer_betas: [0.9, 0.999]
  optimizer_eps: 0.00000001
  optimizer_weight_decay: 0.0001
  optimizer_grad_clip_norm: 10.0
  scheduler_warmup_steps: 1000
  scheduler_reference_steps: 30000
  scheduler_decay_start_step: 27000
  scheduler_decay_lr: 0.000001
job_name: vtla_manipulationnet_15holes
seed: 0
cudnn_deterministic: false
batch_size: 32
num_workers: 8
eval_num_workers: 0
prefetch_factor: 2
persistent_workers: true
dataloader_multiprocessing_context: spawn
steps: 30000
log_freq: 100
eval_steps: 1000
max_eval_samples: 1024
env_eval_freq: 0
save_checkpoint: true
save_freq: 5000
wandb:
  enable: true
  project: vtla-manipulationnet-30k
  mode: online
  disable_artifact: true
